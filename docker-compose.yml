services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jkh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jkh}
      POSTGRES_DB: jkh
    volumes:
      - jkh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jkh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:${POSTGRES_PASSWORD:-jkh}@db:5432/jkh
      JKH_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      # Тот же интервал, что у worker (ниже) — используется только для порога "воркер не
      # отвечает" на /dashboard/summary (app/api/dashboard.py), не для собственной работы
      # backend. Должны совпадать, иначе индикатор живости врёт.
      REPLAY_SLEEP_SECONDS: ${REPLAY_SLEEP_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:${POSTGRES_PASSWORD:-jkh}@db:5432/jkh
      # REPLAY_DATA_DIR по умолчанию /data (см. volumes ниже) — оба трека (насос/вентилятор,
      # дым/газ) читают из него replay_feed_<track>.parquet и catboost_<track>.cbm.
      REPLAY_SLEEP_SECONDS: ${REPLAY_SLEEP_SECONDS:-2}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jkh_pgdata:
