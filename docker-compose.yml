services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jkh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jkh}
      POSTGRES_DB: jkh
    volumes:
      - jkh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jkh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:${POSTGRES_PASSWORD:-jkh}@db:5432/jkh
      JKH_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      # Тот же интервал, что у worker (ниже) — используется только для порога "воркер не
      # отвечает" на /dashboard/summary (app/api/dashboard.py), не для собственной работы
      # backend. Должны совпадать, иначе индикатор живости врёт.
      REPLAY_SLEEP_SECONDS: ${REPLAY_SLEEP_SECONDS:-2}
      # Резюме прогноза для диспетчера на естественном языке (app/services/llm_summary.py) —
      # без ключа функция просто недоступна, не обязателен для остального сервиса.
      JKH_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JKH_ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl/wget нет в python:3.12-slim — используем сам python. worker ждёт именно этого
      # healthcheck (не только db), чтобы не стартовать раньше миграций backend
      # (docker-entrypoint.sh: alembic upgrade head перед uvicorn) — раньше worker мог
      # обратиться к ещё не созданным таблицам на чистом разворачивании.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:${POSTGRES_PASSWORD:-jkh}@db:5432/jkh
      # REPLAY_DATA_DIR по умолчанию /artifacts (см. volumes ниже) — оба трека (насос/вентилятор,
      # дым/газ) читают из него replay_feed_<track>.parquet и catboost_<track>.cbm.
      REPLAY_SLEEP_SECONDS: ${REPLAY_SLEEP_SECONDS:-2}
    volumes:
      - ./artifacts:/artifacts:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jkh_pgdata:
