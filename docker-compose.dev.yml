# Локальная разработка: публикует порты наружу для прямого доступа без прод-прокси.
# Прод НЕ должен использовать этот файл — см. deploy/docker-compose.prod.yml.
services:
  db:
    ports:
      - "5433:5432"  # 5432 на хосте может быть занят другим проектом

  backend:
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "5174:80"
