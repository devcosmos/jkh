name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jkh
          POSTGRES_PASSWORD: jkh
          POSTGRES_DB: jkh_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jkh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:jkh@localhost:55432/jkh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Apply migrations
        # Не только проверка кода — тесты создают схему через create_all, не через alembic
        # (см. backend/README.md, раздел «Тесты»), поэтому сама цепочка миграций иначе
        # никогда не выполняется до прод-разворачивания.
        working-directory: backend
        run: alembic upgrade head
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Episode/flapping tests (DuckDB, no Postgres)
        run: python -m pytest scripts/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
