name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jkh
          POSTGRES_PASSWORD: jkh
          POSTGRES_DB: jkh_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jkh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:jkh@localhost:55432/jkh_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        # OPS-02 (analys_and_todo.md): выше, чем backend/Dockerfile и Dockerfile.worker
        # (python:3.12-slim), намеренно, не рассинхрон. GitHub Actions runner уже несёт полный
        # C/Rust-тулчейн, поэтому catboost/pandas и другие тяжёлые ML-зависимости собираются
        # на 3.14 без проблем. В -slim Docker-образах без этого тулчейна та же сборка падает
        # (y-py, зависимость catboost, требует maturin/cargo/cc) — проверено 22 сентября 2026,
        # см. полное обоснование в backend/Dockerfile.
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Apply migrations
        # Не только проверка кода — тесты создают схему через create_all, не через alembic
        # (см. backend/README.md, раздел «Тесты»), поэтому сама цепочка миграций иначе
        # никогда не выполняется до прод-разворачивания.
        working-directory: backend
        run: alembic upgrade head
      - name: Verify ORM matches migrations
        # DB-01 (analys_and_todo.md): pytest создаёт схему через create_all, не через
        # alembic — само по себе это скрывает расхождение определений между ORM и
        # миграциями (найдено вручную на отдельной чистой БД). alembic check ловит его
        # в CI на каждый PR, а не только при ручной проверке.
        working-directory: backend
        run: alembic check
      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Episode/flapping tests (DuckDB, no Postgres)
        run: python -m pytest ml/tests/ -v
      - name: Maintenance script tests
        run: python -m pytest scripts/tests/ -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  e2e:
    # OPS-03 (analys_and_todo.md): основной сценарий (вход -> риск -> решение диспетчера ->
    # заявка) и запрет доступа к чужому объекту — на синтетических фикстурах
    # (scripts/demo/seed_e2e_fixtures.py), не на закрытом датасете (см. OPS-01 в README.md —
    # тот недоступен в CI).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jkh
          POSTGRES_PASSWORD: jkh
          POSTGRES_DB: jkh
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U jkh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JKH_DATABASE_URL: postgresql+psycopg://jkh:jkh@localhost:55442/jkh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seed E2E fixtures
        run: python3 scripts/demo/seed_e2e_fixtures.py
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/api/health/ready && break; sleep 1; done
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:5173/ && break; sleep 1; done
      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test
      - name: Upload backend/frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
