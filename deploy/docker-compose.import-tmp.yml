# Временный оверлей: публикует Postgres на loopback сервера (127.0.0.1:5432), чтобы
# прогнать одноразовый импорт через SSH-туннель. НЕ использовать постоянно — убрать сразу
# после импорта командой `docker compose ... up -d` без этого файла.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
