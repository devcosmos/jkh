server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html меняется на каждом деплое, но сам файл не переименовывается — без запрета
    # на кэш браузер может годами отдавать старую версию, ссылающуюся на уже удалённые после
    # пересборки JS/CSS-файлы (у них имя с хешем содержимого), и показывать пустую страницу
    # без единой ошибки на экране (см. docs/Статус.md, инцидент 21 сентября 2026).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /assets/* — имя файла включает хеш содержимого (index-<hash>.js), поэтому старая
    # версия ассета никогда не переиспользуется под тем же URL — долгий кэш безопасен.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
